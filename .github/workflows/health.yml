name: Cachet production health

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      alert_drill:
        description: "Exercise issue delivery after checking both live endpoints"
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  group: cachet-production-health
  cancel-in-progress: false

jobs:
  health:
    if: ${{ vars.CACHET_PUBLIC_API_URL != '' && vars.CACHET_PUBLIC_WEB_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the public API and homepage
        id: probe
        env:
          PUBLIC_API_URL: ${{ vars.CACHET_PUBLIC_API_URL }}
          PUBLIC_WEB_URL: ${{ vars.CACHET_PUBLIC_WEB_URL }}
        run: scripts/smoke_prod.sh --health-only
      - name: Exercise the alert path
        id: drill
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.alert_drill }}
        run: |
          echo "Intentional monitoring drill. Both production checks passed."
          exit 1
      - name: Open one issue per outage
        if: ${{ failure() && (steps.probe.outcome == 'failure' || steps.drill.outcome == 'failure') }}
        env:
          GH_TOKEN: ${{ github.token }}
          IS_DRILL: ${{ steps.drill.outcome == 'failure' }}
        run: |
          set -euo pipefail
          title="Cachet production health check failed"
          detail="A public API or homepage check failed."
          if [[ "$IS_DRILL" == true ]]; then
            title="Cachet monitoring drill"
            detail="Both live endpoints passed. This planned failure verifies GitHub issue delivery."
          fi
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json title)"
          if ! jq -e --arg title "$title" 'any(.[]; .title == $title)' <<< "$existing" >/dev/null; then
            echo "$detail" > "$RUNNER_TEMP/issue.md"
            echo >> "$RUNNER_TEMP/issue.md"
            echo "[Inspect the run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." >> "$RUNNER_TEMP/issue.md"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
