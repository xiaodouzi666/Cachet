<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description">
  <title id="title">Cachet architecture and PayPal APIs</title>
  <desc id="description">A publisher, buyer and operator use the Next.js frontend. The FastAPI service calls an SGLang engine for verified prefix hits and uses its SQLite ledger to track PayPal sandbox authorizations, captures, refunds and publisher payouts.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1 1 8 5 1 9" fill="none" stroke="#54766a" stroke-width="2"/></marker>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#17231f}
      .heading{font-weight:700;letter-spacing:-1px}
      .label{font:600 19px monospace;fill:#557065;letter-spacing:1.1px}
      .node{fill:#fff;stroke:#d2dcd5;stroke-width:2}
      .card-title{font-size:33px;font-weight:700}
      .text{font-size:23px;fill:#4e6057}
      .wire{fill:none;stroke:#54766a;stroke-width:3;marker-end:url(#arrow)}
      .dark{fill:#12463c}
      .api{font-size:24px;font-weight:600;fill:#f3f8f3}
      .api-detail{font-size:19px;fill:#c1d8cc}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#f7f7f5"/>
  <g transform="translate(88 74)">
    <rect width="54" height="54" rx="14" fill="#12463c"/>
    <g fill="none" stroke="#eff8ee" stroke-linejoin="round" stroke-width="2.5"><path d="M11 22 27 14 43 22 27 30Z"/><path d="m11 28 16 8 16-8M11 34l16 8 16-8"/></g>
    <text x="72" y="40" class="heading" font-size="43">Cachet</text>
    <text x="1744" y="35" text-anchor="end" class="label">SYSTEM ARCHITECTURE</text>
  </g>
  <text x="88" y="220" class="heading" font-size="72">Warm context, fairly paid.</text>
  <text x="90" y="275" class="text" font-size="29">Measured prefix reuse connects a coding agent’s budget to maintainer royalties.</text>

  <rect x="88" y="368" width="362" height="258" rx="20" class="node"/>
  <text x="118" y="415" class="label">BROWSER</text>
  <text x="118" y="479" class="card-title">Next.js</text>
  <text x="118" y="526" class="text">Publish, quote and approve</text>
  <text x="118" y="562" class="text">AG Studio settlement</text>
  <text x="118" y="598" class="text">Ops Copilot</text>

  <path d="M450 494H575" class="wire"/>
  <text x="513" y="471" text-anchor="middle" class="label">BFF</text>

  <rect x="584" y="368" width="398" height="258" rx="20" class="node"/>
  <text x="616" y="415" class="label">WORKSPACE API</text>
  <text x="616" y="479" class="card-title">FastAPI</text>
  <text x="616" y="526" class="text">Authorize a spending cap</text>
  <text x="616" y="562" class="text">Meter turns and audit SLA</text>
  <text x="616" y="598" class="text">Stream events to the buyer</text>

  <path d="M982 443H1114" class="wire"/><path d="M1114 567H992" class="wire"/>
  <text x="1047" y="422" text-anchor="middle" class="label">PROMPT</text>
  <text x="1047" y="603" text-anchor="middle" class="label">HITS</text>

  <rect x="1122" y="368" width="330" height="258" rx="20" class="node"/>
  <text x="1153" y="415" class="label">INFERENCE</text>
  <text x="1153" y="479" class="card-title">SGLang</text>
  <text x="1153" y="526" class="text">Warm nested prefixes</text>
  <text x="1153" y="562" class="text">Token-level cache hits</text>
  <text x="1153" y="598" class="text">Measured GPU latency</text>

  <rect x="1480" y="368" width="352" height="258" rx="20" class="node"/>
  <text x="1511" y="415" class="label">ACCOUNTING</text>
  <text x="1511" y="479" class="card-title">SQLite ledger</text>
  <text x="1511" y="526" class="text">Balanced transactions</text>
  <text x="1511" y="562" class="text">Shapley royalties</text>
  <text x="1511" y="598" class="text">PayPal reconciliation</text>
  <path d="M860 626V668H1660V638" class="wire"/>
  <path d="M780 626V730" class="wire"/><path d="M1720 730V638" class="wire"/>

  <rect x="88" y="738" width="1744" height="250" rx="22" class="dark"/>
  <text x="125" y="797" class="heading" style="fill:#fff" font-size="37">PayPal sandbox</text>
  <text x="1775" y="792" text-anchor="end" class="api-detail">Orders, money movement and verified events</text>
  <path d="M124 827H1790" stroke="#467468"/>
  <g transform="translate(125 881)"><text class="api">Orders v2</text><text y="42" class="api-detail">Create and authorize</text></g>
  <g transform="translate(438 881)"><text class="api">Payments v2</text><text y="42" class="api-detail">Capture, void and refund</text></g>
  <g transform="translate(819 881)"><text class="api">Payouts v1</text><text y="42" class="api-detail">Batch publisher payouts</text></g>
  <g transform="translate(1177 881)"><text class="api">Webhooks v1</text><text y="42" class="api-detail">Verify notifications</text></g>
  <g transform="translate(1502 881)"><text class="api">Transaction Search</text><text y="42" class="api-detail">Read via Agent Toolkit</text></g>
</svg>
